# API Keys Configuration
# Centralized location for all external service API keys

# Helius - Solana RPC provider
# Get your API key from https://helius.dev
# Enables WebSocket transaction monitoring and optimized RPC
helius: ''

# Infura - Ethereum/EVM RPC provider
# Get your API key from https://infura.io
# Supports 30+ networks including mainnet, Polygon, Arbitrum, etc.
infura: ''

# Chainstack - Multi-chain RPC provider (Solana + EVM)
# Get your API key from https://console.chainstack.com/user/settings/api-keys
# Auto-discovers deployed nodes via the Platform API
chainstack: ''

# CoinGecko - Price data and pool information
# Get your API key from https://www.coingecko.com/en/api/pricing
# Free tier: 30 calls/minute without key
coingecko: ''

# Etherscan - Gas price estimates for Ethereum networks
# Get your API key from https://etherscan.io/myapikey
# Works for all Etherscan V2 API supported chains
etherscan: ''

# Privy - Server wallet signing
# Get your credentials from https://dashboard.privy.io
# Required for Privy wallet integration.
#
# Only the (non-sensitive) App ID lives here. The two secrets are read from
# environment variables ONLY, never from this file, so reading conf cannot recover
# them and they can be injected at runtime by a secret manager:
#   GATEWAY_PRIVY_APP_SECRET           - Privy app secret
#   GATEWAY_PRIVY_AUTHORIZATION_KEY    - base64 P-256 PKCS8 private key (no PEM headers)
#                                        that owns your Privy wallets/policies; required
#                                        to sign once a wallet has an owner. Keep this off
#                                        any host that builds transactions if you can.
privyAppId: ''
